syntax = "proto3";

package trip;

option go_package = "shared/proto/trip;trip";

service TripService {
  rpc PreviewTrip(PreviewTripRequest) returns (PreviewTripResponse);
}

message PreviewTripRequest {
  string user_id = 1;
  Coordinate pickup = 2;
  Coordinate destination = 3;
}

message PreviewTripResponse {
  string user_id = 1;
  Route route = 2;
  repeated RideFare ride_fares = 3;
}

message RideFare {
  string id = 1;
  string user_id = 2;
  string package_slug = 3;
  double total_price_in_cents = 4;
}

message Route {
  double distance = 1;
  double duration = 2;
  repeated Geometry geometry = 3;
}

message Geometry {
  repeated Coordinate coordinates = 1;
}

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}
